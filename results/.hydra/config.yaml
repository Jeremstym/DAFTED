trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: auto
  devices: 1
  enable_progress_bar: true
  enable_model_summary: true
  precision: bf16-mixed
  max_steps: 2000
  max_epochs: 100
task:
  optim:
    _target_: torch.optim.AdamW
    lr: 0.001
    weight_decay: 0.01
    optimizer:
      _target_: torch.optim.AdamW
      lr: 0.0001
      weight_decay: 1.0e-05
  _target_: didactic.tasks.cardiac_multimodal_representation.CardiacMultimodalRepresentationTask
  enable_model_summary: ${oc.select:trainer.enable_model_summary,True}
  model_summary_mode: eval
  train_log_kwargs:
    prog_bar: false
    logger: true
    on_step: true
    on_epoch: null
  val_log_kwargs:
    prog_bar: false
    logger: true
    on_step: null
    on_epoch: true
  tabular_attrs: ${list.remove:${data.process_patient_kwargs.tabular_attrs},${exclude_tabular_attrs}}
  time_series_attrs: ${data.process_patient_kwargs.time_series_attrs}
  time_series_tokenizer:
    model:
      _target_: torch.nn.Sequential
      _args_:
      - _target_: collections.OrderedDict
        expand_feat_dim:
          _target_: vital.models.layers.Lambda
          fn:
            _target_: torch.unsqueeze
            _partial_: true
          dim: -1
        upsampling:
          _target_: torch.nn.Linear
          in_features: 1
          out_features: ${task.embed_dim}
        positional_encoding:
          _target_: didactic.models.layers.PositionalEncoding
          sequence_len: ${task.time_series_tokenizer.resample_dim}
          d_model: ${task.embed_dim}
        transformer_encoder:
          _target_: torch.nn.TransformerEncoder
          num_layers: 1
          norm:
            _target_: torch.nn.LayerNorm
            normalized_shape: ${task.embed_dim}
          encoder_layer:
            _target_: torch.nn.TransformerEncoderLayer
            d_model: ${task.embed_dim}
            nhead: 4
            dim_feedforward: ${task.embed_dim}
            dropout: 0.3
            activation: relu
            batch_first: true
            norm_first: true
        sequence_pooling:
          _target_: didactic.models.layers.SequencePooling
          d_model: ${task.embed_dim}
    _target_: didactic.models.time_series.TimeSeriesEmbedding
    resample_dim: 64
  model:
    encoder:
      _target_: autogluon.multimodal.models.ft_transformer.FT_Transformer
      d_token: ${task.embed_dim}
      n_blocks: 3
      attention_n_heads: 8
      attention_dropout: 0.2
      attention_initialization: kaiming
      attention_normalization: layer_norm
      ffn_d_hidden: ${task.model.encoder.d_token}
      ffn_dropout: 0.1
      ffn_activation: reglu
      ffn_normalization: layer_norm
      residual_dropout: 0.1
      prenormalization: true
      first_prenormalization: false
      last_layer_query_idx: null
      n_tokens: null
      kv_compression_ratio: null
      kv_compression_sharing: null
      head_activation: false
      head_normalization: null
      d_out: null
    contrastive_head:
      _target_: vital.models.classification.mlp.MLP
      input_shape:
      - ${task.embed_dim}
      output_shape:
      - ${task.embed_dim}
      hidden:
      - ${task.embed_dim}
      dropout: 0
    prediction_head:
      _target_: didactic.models.layers.FTPredictionHead
      in_features: ${task.embed_dim}
    ordinal_head:
      _target_: didactic.models.layers.UnimodalLogitsHead
      in_features: ${task.embed_dim}
      distribution: binomial
      tau: 1
      tau_mode: learn_fn
  embed_dim: 192
  views: ${data.patients_kwargs.views}
  cls_token: true
  sequence_pooling: false
  mtr_p:
  - 0.3
  - 0
  mt_by_attr: false
  tabular_tokenizer:
    _target_: didactic.models.tabular.TabularEmbedding
    d_token: ${task.embed_dim}
  predict_losses:
    ht_severity:
      _target_: torch.nn.CrossEntropyLoss
  ordinal_mode: true
  contrastive_loss:
    _target_: vital.metrics.train.metric.NTXent
  contrastive_loss_weight: 0
data:
  _target_: vital.data.cardinal.data_module.CardinalDataModule
  batch_size: 128
  num_workers: 0
  patients_kwargs:
    _target_: vital.data.cardinal.utils.itertools.Patients
    data_roots:
    - ${oc.env:CARDINAL_DATA_PATH}
    include_patients: null
    exclude_patients: null
    patient_attrs_filter: []
    views:
    - A4C
    - A2C
    handle_attrs_errors: null
    fast_dev_patients: null
  transform_patient_kwargs:
    train:
      time_series_attrs_transforms:
        any:
          interp1d:
            _target_: vital.data.transforms.Interp1d
            num: 64
    val:
      time_series_attrs_transforms:
        any:
          interp1d:
            _target_: vital.data.transforms.Interp1d
            num: 64
    test:
      time_series_attrs_transforms:
        any:
          interp1d:
            _target_: vital.data.transforms.Interp1d
            num: 64
  process_patient_kwargs:
    tabular_attrs:
    - ef
    - edv
    - esv
    - a4c_ed_sc_min
    - a4c_ed_sc_max
    - a4c_ed_lc_min
    - a4c_ed_lc_max
    - a2c_ed_ic_min
    - a2c_ed_ic_max
    - a2c_ed_ac_min
    - a2c_ed_ac_max
    - age
    - sex
    - bmi
    - hf
    - cad
    - pad
    - stroke
    - tobacco
    - diabetes
    - dyslipidemia
    - etiology
    - ddd
    - bradycardic
    - ace_inhibitor
    - arb
    - tz_diuretic
    - central_acting
    - beta_blocker
    - spironolactone
    - alpha_blocker
    - ccb
    - sbp_24
    - dbp_24
    - pp_24
    - sbp_tte
    - dbp_tte
    - pp_tte
    - ht_severity
    - ht_grade
    - hr_tte
    - creat
    - gfr
    - nt_probnp
    - nt_probnp_group
    - e_velocity
    - a_velocity
    - mv_dt
    - lateral_e_prime
    - septal_e_prime
    - reduced_e_prime
    - e_e_prime_ratio
    - d_dysfunction_e_e_prime_ratio
    - la_volume
    - dilated_la
    - ph_vmax_tr
    - lvm_ind
    - lvh
    - ivs_d
    - lvid_d
    - pw_d
    - diastolic_dysfunction_param_sum
    - diastolic_dysfunction
    - ht_cm
    time_series_attrs:
    - gls
    - ls_left
    - ls_right
    - lv_area
    - lv_length
    - myo_thickness_left
    - myo_thickness_right
    mask_tag: mask
    bmode_tag: null
  datapipes_kwargs:
    cache: true
  subsets:
    train: ${oc.env:CARDINAL_DATA_PATH}/train.txt
    val: ${oc.env:CARDINAL_DATA_PATH}/val.txt
    test: ${oc.env:CARDINAL_DATA_PATH}/test.txt
  predict:
    _target_: didactic.data.cardinal.predict.CardiacRepresentationPredictionWriter
    write_path: ${sys.getcwd:}/predictions
    hue_attrs: ${data.process_patient_kwargs.tabular_attrs}
callbacks:
  model_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val/loss
    save_last: true
  learning_rate_finder:
    _target_: pytorch_lightning.callbacks.LearningRateFinder
logger:
  _target_: pytorch_lightning.loggers.comet.CometLogger
  offline: false
  project_name: null
  workspace: null
seed: null
float32_matmul_precision: high
resume: false
ckpt: ./didactic-xtab-finetune.ckpt
weights_only: true
strict: false
train: true
test: true
predict: true
results_processors_multiprocessing: true
comet_tags: null
choices: ${hydra:runtime.choices}
best_model_save_path: null
exclude_tabular_attrs:
- ht_severity
- ht_grade
n_tabular_attrs: ${builtin.len:${task.tabular_attrs}}
n_time_series_attrs: ${op.mul:${builtin.len:${task.views}},${builtin.len:${task.time_series_attrs}}}
experiment_dirname: data=${hydra:runtime.choices.task/data}/contrastive=${oc.select:task.contrastive_loss_weight,0}/time_series_tokenizer=${hydra:runtime.choices.task/time_series_tokenizer/model}
