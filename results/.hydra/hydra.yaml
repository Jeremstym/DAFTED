hydra:
  run:
    dir: ./results/
  sweep:
    dir: ${oc.env:CARDIAC_MULTIMODAL_REPR_PATH}/xtab-finetune
    subdir: ${experiment_dirname}/targets=${oc.dict.keys:task.predict_losses}/ordinal_mode=${task.ordinal_mode},distribution=${task.model.ordinal_head.distribution},tau_mode=${task.model.ordinal_head.tau_mode}/${hydra.job.override_dirname}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=./results/
    - hydra.mode=RUN
    task:
    - +experiment=cardinal/xtab-finetune
    - +trainer.max_epochs=100
    - task.predict_losses={ht_severity:{_target_:torch.nn.CrossEntropyLoss}}
    - exclude_tabular_attrs=[ht_severity,ht_grade]
    - ckpt=./didactic-xtab-finetune.ckpt
  job:
    name: runner
    chdir: true
    override_dirname: ''
    id: ???
    num: ???
    config_name: vital_default
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys:
        - hydra/launcher
        - hydra.launcher.n_jobs
        - hydra.run.dir
        - hydra.sweep.dir
        - hydra.sweep.subdir
        - experiment
        - trainer.enable_progress_bar
        - trainer.max_epochs
        - callbacks.learning_rate_finder
        - ckpt
        - data
        - exclude_tabular_attrs
        - task/data
        - task.tabular_attrs
        - task.time_series_attrs
        - task.predict_losses
        - task.contrastive_loss._target_
        - task.contrastive_loss_weight
        - task.mtr_p
        - task.mt_by_attr
        - task.embed_dim
        - task/time_series_tokenizer/model
        - task/model/encoder
        - task.ordinal_mode
        - task.model.ordinal_head.distribution
        - task.model.ordinal_head.tau_mode
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/stympopper/didactic
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: didactic.config
      schema: pkg
      provider: main
    - path: vital.config
      schema: pkg
      provider: vital-searchpath-plugin
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/stympopper/didactic/results
    choices:
      experiment: cardinal/xtab-finetune
      task/model/prediction_head@task.model.ordinal_head: unimodal-logits
      task/model/prediction_head: ft-prediction
      task/model/contrastive_head: mlp
      task/model/encoder: xtab-ft-transformer
      task/time_series_tokenizer/model: transformer
      task/data: tabular+time-series
      logger: comet/online
      data: cardinal
      data/transform@data.transform_patient_kwargs.test: cardinal/test
      data/transform@data.transform_patient_kwargs.val: cardinal/val
      data/transform@data.transform_patient_kwargs.train: cardinal/train
      data/iterator@data.patients_kwargs: cardinal/patients
      data/results_processors@results_processors: null
      data/postprocessing: null
      data/predict: null
      task: default
      task/results_processors@results_processors: null
      task/optim: adamw
      task/model: null
      trainer: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
