# @package _global_

defaults:
  - orchid/cardiac-multimodal-representation
  - override /task/model/encoder: xtab

trainer:
  max_steps: 2000

task:
  predict_losses:
    diagnosis:
      _target_: torch.nn.CrossEntropyLoss
  ordinal_mode: False
  attribute_reg_loss:
    _target_: didactic.models.losses.AttributeRegularizationLoss
    attribute_list: [ef,esv,edv,bmi,age]
    reg_dims: [0, 1, 2, 3, 4]  # Assuming ef has 5 attributes
    factor: 5.0
  attribute_reg_loss_weight: 1.0

  # Use CLS token necessary for attribute regularization
  cls_token: True

  # Architecture parameters to define the same architecture as XTab
  embed_dim: 192

  # Default to the light finetuning describe in XTab's paper
  optim:
    optimizer:
      _target_: torch.optim.AdamW
      lr: 1e-4
      weight_decay: 1e-5

# Change checkpoint loading defaults to:
ckpt: ??? # Make it mandatory to provide a checkpoint
weights_only: True  # Only load the weights and ignore the hyperparameters
strict: False # Only load weights where they match the defined network, to only some changes (e.g. heads, etc.)
