# @package _global_

defaults:
  - orchid/cardiac-multimodal-tabpfn
  - override /task/model/encoder: tabpfn-encoder

trainer:
  max_steps: 1000

task:
  predict_losses:
    diagnosis:
      _target_: torch.nn.CrossEntropyLoss
  embed_dim: 192  # Must match TabPFN's d_model
  model:
    freeze_encoder: True # Whether to freeze the TabPFN encoder during training
    freeze_ts_pfn_encoder: False # Whether to freeze the TabPFN encoder when used for time series data
    use_secondary_encoder: False # Whether to use a secondary encoder after TabPFN's encoder
    PFN_for_ts: False # Whether to use TabPFN's encoder for the time series data (True) or a Transformer
    # secondary_encoder:
    #   _target_: torch.nn.Sequential
    #   _args_:
    #     - _target_: collections.OrderedDict
    #       fc1:
    #         _target_: torch.nn.Linear
    #         in_features: ${task.embed_dim}
    #         out_features: ${op.mul:2,${task.embed_dim}}
    #       act1:
    #         _target_: torch.nn.GELU
    #       fc2:
    #         _target_: torch.nn.Linear
    #         in_features: ${op.mul:2,${task.embed_dim}}
    #         out_features: ${task.embed_dim}
    #       act2:
    #         _target_: torch.nn.GELU
    #       dropout:
    #         _target_: torch.nn.Dropout
    #         p: 0.1

  # Architecture parameters to define the same architecture as XTab

  # Default to the light finetuning describe in XTab's paper
  optim:
    optimizer:
      _target_: torch.optim.AdamW
      lr: 1e-4
      weight_decay: 1e-5

# Change checkpoint loading defaults to:
ckpt: ??? # Make it mandatory to provide a checkpoint
weights_only: True  # Only load the weights and ignore the hyperparameters
strict: False # Only load weights where they match the defined network, to only some changes (e.g. heads, etc.)
